<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 676" width="480" height="676" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#141414"/></marker></defs>
<rect x="10" y="16" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">The founder&#x27;s context</text>
<text x="240" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Skills, interests, and limits</text>
<line x1="240" y1="80" x2="240" y2="111" stroke="#141414" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#4a4a4a">Stage 1, Pool</text>
<rect x="10" y="114" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">Source pool</text>
<text x="240" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Current sources from news search</text>
<line x1="240" y1="178" x2="240" y2="209" stroke="#141414" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="198" font-family="system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#4a4a4a">Stage 2, Match</text>
<rect x="10" y="212" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="239" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">Word-based matching</text>
<text x="240" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Sources matched to the founder, no vector search</text>
<line x1="240" y1="276" x2="240" y2="307" stroke="#141414" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="296" font-family="system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#4a4a4a">Stage 3, Shape</text>
<rect x="10" y="310" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">Problems</text>
<text x="240" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Each with a direction, a deliverable, and linked sources</text>
<line x1="240" y1="374" x2="240" y2="405" stroke="#141414" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="394" font-family="system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#4a4a4a">Stage 4, Options</text>
<rect x="10" y="408" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">Three options per problem</text>
<text x="240" y="456" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Strong, Unusual, Wild</text>
<line x1="240" y1="472" x2="240" y2="503" stroke="#141414" stroke-width="2" marker-end="url(#ah)"/>
<text x="250" y="492" font-family="system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#4a4a4a">saved as</text>
<rect x="10" y="506" width="460" height="62" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="240" y="533" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#141414">The founder&#x27;s set</text>
<text x="240" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#4a4a4a">Private by default; his own set is public by his choice</text>
<text x="240" y="582" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#141414">Diagnostics: every stage writes a row.</text>
<text x="240" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#141414">Limits in the code: a monthly cost cap, a call budget per run,</text>
<text x="240" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#141414">a size bound on every model call.</text>
</svg>